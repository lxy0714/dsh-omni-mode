name: 问题反馈 / Bug report
description: 提交可复现问题，不包含凭据或私人日志。 / Report a reproducible issue without secrets or private logs.
body:
  - type: input
    id: versions
    attributes:
      label: 版本与环境 / Versions and environment
      description: 插件、DSH、Node、系统和安装方式。 / Plugin, DSH, Node, OS and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现 / Minimal reproduction
      description: 预期、实际行为及共存插件。 / Expected and actual behavior, plus relevant coexistence plugins.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围 / Area
      description: 选择最接近的一项，便于定位。 / Pick the closest area to speed up triage.
      options:
        - 预设行为与授权 / Preset behavior and authorization
        - 领域技能与能力目录 / Domain skills and capability index
        - 本地领域操作（capabilities/runner.mjs） / Local operations
        - 代码视觉（media/runner.mjs） / Code media
        - 安装与兼容 / Installation and compatibility
        - 文档 / Documentation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏错误 / Sanitized error
      description: 删除令牌、私人路径、源码与对话；不要上传整个 profile。 / Remove tokens, private paths, source and conversations; never upload the full profile.
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认 / Privacy
      options:
        - label: 我已移除秘密与私人数据。 / I removed secrets and private data.
          required: true
