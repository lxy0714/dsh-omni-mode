name: Release / 版本发布
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 现有版本标签，例如 v1.3.1 / Existing version tag, for example v1.3.1
        required: true
permissions:
  contents: read
jobs:
  release:
    name: 发布 / Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 检出版本 / Check out version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: 配置 Node.js / Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 核对标签与包版本 / Match tag and package version
        env:
          TAG: ${{ inputs.tag }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - name: 安装固定依赖 / Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 运行全部验证 / Run full verification
        run: npm run verify
      - name: 打包与生成校验和 / Pack release and checksums
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const files=fs.readdirSync("artifacts").filter(x=>x.endsWith(".tgz"));fs.writeFileSync("artifacts/SHA256SUMS.txt",files.map(x=>crypto.createHash("sha256").update(fs.readFileSync("artifacts/"+x)).digest("hex")+"  "+x).join("\n")+"\n");'
      - name: 拒绝待发布稿 / Refuse unreleased draft notes
        run: |
          # The notes file is published verbatim. A draft that still says
          # "not released"/"尚未发布" would put that statement into the
          # public release body, so fail before tagging anything.
          if grep -qE '尚未发布|not released yet|待发布 / pending release' docs/release-notes.md; then
            echo "docs/release-notes.md still carries a not-released marker; finalize it first." >&2
            exit 1
          fi
      - name: 创建双语版本说明 / Create bilingual release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" artifacts/*.tgz artifacts/SHA256SUMS.txt --verify-tag --title "全能模式 / Omni mode $TAG" --notes-file docs/release-notes.md
