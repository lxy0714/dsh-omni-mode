name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.3.0
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Match tag and package version
        env:
          TAG: ${{ inputs.tag }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Pack release and checksums
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const files=fs.readdirSync("artifacts").filter(x=>x.endsWith(".tgz"));fs.writeFileSync("artifacts/SHA256SUMS.txt",files.map(x=>crypto.createHash("sha256").update(fs.readFileSync("artifacts/"+x)).digest("hex")+"  "+x).join("\n")+"\n");'
      - name: Create fixed-version GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" artifacts/*.tgz artifacts/SHA256SUMS.txt --verify-tag --title "Omni mode $TAG" --generate-notes
